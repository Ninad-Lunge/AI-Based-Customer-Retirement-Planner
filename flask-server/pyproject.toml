# Backend tooling config.
#
# ruff is used for linting (and import sorting). The rule set is intentionally
# conservative for Phase 0: catch real problems (unused imports/vars, undefined
# names, obvious bugs) without churning the existing code style.

[tool.ruff]
line-length = 100
target-version = "py312"
# alembic/ is excluded: migration files are autogenerated artefacts and the
# generated JSONB(astext_type=Text()) render trips F401 on a used import.
extend-exclude = [".venv", "saved_models", "__pycache__", "alembic"]

[tool.ruff.lint]
# E/F = pycodestyle errors + pyflakes (real correctness issues), I = isort.
# pyupgrade (UP) and bugbear (B) are intentionally NOT enabled in Phase 0 to
# avoid churning the existing, working engine code (e.g. typing.Dict vs dict).
# They are good candidates for a later cleanup phase.
select = ["E", "F", "I"]
ignore = ["E501"]
