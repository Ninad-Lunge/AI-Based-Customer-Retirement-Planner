[pytest]
# Phase 0 test configuration for the Flask backend.
#
# Tests live in flask-server/tests/.  Run from the flask-server/ directory:
#   pytest
#   pytest --cov=. --cov-report=term-missing
#
# Markers:
#   slow  - tests that import TensorFlow/keras (module import of
#           investment_strategy). Deselect with:  pytest -m "not slow"
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q
markers =
    slow: tests that trigger a heavy import (keras/tensorflow) or are otherwise slow
filterwarnings =
    ignore::DeprecationWarning
