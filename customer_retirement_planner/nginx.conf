# nginx config for the React SPA.
# - Serves static assets from /usr/share/nginx/html.
# - Falls back to index.html for client-side routes (/Plan, /Home, etc.),
#   so a hard refresh on a route doesn't 404.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache fingerprinted static assets.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: unknown paths resolve to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
